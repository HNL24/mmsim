# Avellaneda-Stoikov quoter. Merged on top of base.yaml.
strategy:
  name: avellaneda_stoikov
  gamma: 1.0e-5                          # 1/(ticks*share). PLACEHOLDER: sane on calibration window; E2 picks it
  horizon: constant                      # constant | finite
  tau0_s: 60                             # T - t when horizon == constant
  sigma_estimator:
    name: rolling_rv
    window_s: 300
    sample_s: 1
  # k (1/ticks) and sigma_cal (units check) are read from here; written by scripts/calibrate.py
  calibration_path: results/calibration/params.yaml
  imbalance_beta_ticks: 0.0              # ticks per unit touch imbalance; 0 = plain A-S. E6 sets it
